<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión · Empleo USAC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/_ds/industry-af27d658-deab-4daa-98ba-cd0e1dec356b/styles.css" />
  <style>
    body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: var(--space-6) var(--space-4); }
    .login-box { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: var(--space-5); }
    .error-msg { color: var(--color-error, red); font-size: 14px; display: none; }
    .error-msg.visible { display: block; }
  </style>
</head>
<body>
  <div class="login-box">
    <div>
      <a href="/" style="font-size:13px; opacity:0.6; text-decoration:none;">← Volver</a>
      <h1 class="card-title" style="margin-top:var(--space-3); font-size:1.8rem;">Iniciar sesión</h1>
      <p style="font-size:14px; opacity:0.7; margin-top:var(--space-1);">Empleo USAC · Facultad de Ingeniería</p>
    </div>

    <form id="loginForm" class="card blueprint" style="padding:var(--space-6); display:flex; flex-direction:column; gap:var(--space-4);">
      <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>

      <div class="field">
        <label for="email">Correo electrónico</label>
        <input id="email" type="email" class="input" placeholder="correo@usac.edu.gt" required />
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <input id="password" type="password" class="input" placeholder="••••••••" required />
      </div>

      <p id="errorMsg" class="error-msg"></p>

      <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Entrar</button>
    </form>

    <p style="text-align:center; font-size:14px; opacity:0.7;">
      ¿Sin cuenta? <a href="/">Regístrate aquí</a>
    </p>
  </div>

  <script type="module">
    import { api } from "/js/api.js";
    import { auth } from "/js/auth.js";

    if (auth.isLoggedIn()) auth.redirectToDashboard();

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("submitBtn");
      const errorMsg = document.getElementById("errorMsg");

      btn.disabled = true;
      btn.textContent = "Entrando...";
      errorMsg.classList.remove("visible");

      try {
        const res = await api.login({
          email: document.getElementById("email").value,
          password: document.getElementById("password").value,
        });
        auth.saveSession(res);
        auth.redirectToDashboard();
      } catch (err) {
        errorMsg.textContent = err.message;
        errorMsg.classList.add("visible");
        btn.disabled = false;
        btn.textContent = "Entrar";
      }
    });
  </script>
</body>
</html>
