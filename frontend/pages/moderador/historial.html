<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Historial de moderación</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/_ds/industry-af27d658-deab-4daa-98ba-cd0e1dec356b/styles.css" />
  <style>
    body { min-height: 100vh; display: flex; flex-direction: column; }
    .page { flex: 1; padding: var(--space-8) var(--space-6); max-width: 860px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: var(--space-6); }
    .page-title { font-family: var(--font-heading); font-size: 22px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }
    .vacante-list { display: flex; flex-direction: column; gap: var(--space-3); }
    .vacante-row { display: flex; flex-direction: column; gap: var(--space-3); padding: var(--space-5); }
    .row-top { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-4); flex-wrap: wrap; }
    .row-info { flex: 1; display: flex; flex-direction: column; gap: 4px; }
    .row-puesto { font-family: var(--font-heading); font-size: 16px; font-weight: 700; }
    .row-meta { font-size: 13px; opacity: 0.6; }
    .tags-row { display: flex; gap: var(--space-2); flex-wrap: wrap; }
    .badge-aprobada { background: color-mix(in oklch, var(--color-accent) 20%, transparent); color: var(--color-accent); }
    .badge-rechazada { background: color-mix(in oklch, #f87171 20%, transparent); color: #f87171; }
    .empty-state { text-align:center; padding:var(--space-12) var(--space-6); display:flex; flex-direction:column; align-items:center; gap:var(--space-3); }
    .empty-icon { font-size:40px; opacity:0.4; }
    .empty-title { font-family:var(--font-heading); font-size:16px; font-weight:700; opacity:0.5; text-transform:uppercase; letter-spacing:0.06em; }
    .spinner { text-align:center; padding:var(--space-10); opacity:0.4; font-size:13px; }
  </style>
</head>
<body>
  <nav class="nav">
    <a href="/pages/moderador/home.html" class="nav-brand">Empleo USAC · FIUSAC</a>
    <div style="display:flex; gap:var(--space-3); align-items:center;">
      <span class="tag tag-accent-2">Moderador</span>
      <a href="/pages/moderador/cola.html" class="btn btn-ghost" style="font-size:14px;">Cola</a>
      <button class="btn btn-ghost" id="logoutBtn" style="font-size:14px;">Salir</button>
    </div>
  </nav>

  <main class="page">
    <div style="display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:var(--space-3);">
      <h1 class="page-title">📁 Historial</h1>
      <span style="font-size:13px; opacity:0.5; font-family:var(--font-heading); letter-spacing:0.06em;" id="counter"></span>
    </div>
    <div id="lista"><div class="spinner">Cargando...</div></div>
  </main>

  <script type="module">
    import { api } from "/js/api.js";
    import { auth } from "/js/auth.js";

    auth.requireAuth(["moderador"]);
    document.getElementById("logoutBtn").addEventListener("click", () => auth.logout());

    const CONTRATO_LABELS = { tiempo_completo: "Tiempo completo", medio_tiempo: "Medio tiempo", practica: "Práctica", freelance: "Freelance" };
    const MODALIDAD_LABELS = { presencial: "Presencial", remoto: "Remoto", hibrido: "Híbrido" };

    async function cargar() {
      try {
        const vacantes = await api.getHistorial();
        const lista = document.getElementById("lista");
        document.getElementById("counter").textContent = `${vacantes.length} procesada${vacantes.length !== 1 ? 's' : ''}`;

        if (!vacantes.length) {
          lista.innerHTML = `
            <div class="empty-state">
              <div class="empty-icon">📭</div>
              <div class="empty-title">Sin historial aún</div>
              <div class="empty-sub">Las vacantes procesadas aparecerán aquí.</div>
            </div>`;
          return;
        }

        lista.innerHTML = `<div class="vacante-list">${vacantes.map(v => {
          const esRef = v.tipo === "referido";
          const fecha = v.created_at ? new Date(v.created_at).toLocaleDateString('es-GT') : '';
          return `
            <div class="card vacante-row" style="border:1px solid var(--color-neutral-200); opacity:${v.estado === 'rechazada' ? '0.65' : '1'};">
              <div class="row-top">
                <div class="row-info">
                  <div class="row-puesto">${v.puesto}</div>
                  <div class="row-meta">${v.empresa_nombre}${v.ubicacion ? ' · ' + v.ubicacion : ''}${fecha ? ' · ' + fecha : ''}</div>
                </div>
                <span class="tag badge-${v.estado}">${v.estado === 'aprobada' ? '✓ Aprobada' : '✗ Rechazada'}</span>
              </div>
              <div class="tags-row">
                <span class="tag ${esRef ? 'tag-accent-2' : 'tag-accent'}">${esRef ? 'Referido' : 'Empresa'}</span>
                <span class="tag tag-neutral">${v.carrera_compatible}</span>
                <span class="tag tag-neutral">${MODALIDAD_LABELS[v.modalidad] || v.modalidad}</span>
                <span class="tag tag-neutral">${CONTRATO_LABELS[v.tipo_contrato] || v.tipo_contrato}</span>
              </div>
            </div>`;
        }).join("")}</div>`;
      } catch (err) {
        document.getElementById("lista").innerHTML = `<p style="opacity:0.5; font-size:14px;">Error: ${err.message}</p>`;
      }
    }

    cargar();
  </script>
</body>
</html>
